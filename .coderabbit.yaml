# CodeRabbit config — https://docs.coderabbit.ai/reference/yaml-template
# Install: https://github.com/marketplace/coderabbitai (free for public repos)

language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - "!**/*.lock"
    - "!package-lock.json"
    - "!backend/uv.lock"
    - "!data/manual-collection/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/__pycache__/**"
    - "!**/*.min.js"
    - "!**/*.min.css"

  path_instructions:
    - path: "backend/**/*.py"
      instructions: |
        FastAPI + async SQLAlchemy + Pydantic v2 codebase, Python 3.12+.
        JSON returned to the frontend must be camelCase.
        Flag missing type hints on public functions, sync DB calls in async paths,
        and any secret-looking literal.
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        React + Vite + TypeScript. Keep the public catalogue UI simple;
        admin-only surfaces must stay behind auth checks.
        Flag `any` types, uncaught promise rejections, and missing key props.
    - path: "backend/tests/**/*.py"
      instructions: |
        Tests hit a real Postgres (devradar_test), not mocks — flag any new
        mock of the DB layer.

chat:
  auto_reply: true

tone_instructions: |
  Be concise and direct. Skip praise; only flag issues that meaningfully
  affect correctness, security, or maintainability. Prefer one clear
  suggestion over a list of nitpicks.
