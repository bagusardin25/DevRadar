# Mirrors CONTRIBUTING.md "Checks before a PR" + SECURITY secret hygiene.
# Local: Node 20+, Python 3.12, Docker infra on 5434/6379.
# CI pins: Node 22, Python 3.12, Postgres 16, Redis 7.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend & extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - name: Install
        run: npm ci
      # Same as `npm run check` / `make check-frontend` (build then lint).
      - name: Build & lint
        run: npm run check
      - name: Extension install
        working-directory: extension
        run: npm ci
      - name: Extension stress, typecheck & builds
        working-directory: extension
        run: npm run check

  extension:
    name: Extension test & package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci
      - name: Test & typecheck
        run: |
          npm test
          npm run typecheck
      - name: Package Chrome
        run: npm run build
      - name: Package Firefox
        run: npm run build:firefox

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devradar
          POSTGRES_PASSWORD: devradar
          POSTGRES_DB: devradar
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U devradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Align with backend/.env.example seed-demo defaults where possible.
    env:
      APP_ENV: test
      API_BASE_PATH: /api/v1
      DATABASE_URL: postgresql+asyncpg://devradar:devradar@127.0.0.1:5434/devradar
      REDIS_URL: redis://127.0.0.1:6379/0
      SESSION_SECRET: ci-session-secret-at-least-32-chars-long
      EMAIL_ENCRYPTION_KEY: ci-email-encryption-key-material
      EMAIL_HMAC_KEY: ci-email-hmac-key-at-least-32-chars
      LLM_PROVIDER: disabled
      AI_REVIEW_ENABLED: "true"
      OBJECT_STORAGE_BACKEND: memory
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      TRUSTED_PROXY_HOPS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Python setup
        # Same as `make sync-backend`.
        run: |
          cd backend
          uv sync --all-extras --frozen
      - name: PostgreSQL extensions
        # Same extensions as infra/postgres/init.sql (Compose mounts that file;
        # GitHub service containers need them created explicitly).
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=devradar psql -h 127.0.0.1 -p 5434 -U devradar -d devradar -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS citext;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          SQL
      # Same order/flags as `make check-backend` / scripts/check.sh:
      #   ruff check app tests → alembic upgrade head → pytest
      # (pytest flags live in backend/pyproject.toml addopts)
      - name: Lint, migrate, test
        run: |
          cd backend
          uv run ruff check app tests
          uv run alembic upgrade head
          uv run pytest
