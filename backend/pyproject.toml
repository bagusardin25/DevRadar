[project]
name = "devradar-backend"
version = "0.1.0"
description = "DevRadar backend: discover, verify, and monitor hackathons and AI offers"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.6.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "boto3>=1.43.56",
    "cryptography>=42.0",
    "openai>=2.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Match CI (`.github/workflows/ci.yml`) so `uv run pytest` is enough everywhere.
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
