name: devradar

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # 5434 avoids clash with a local Windows PostgreSQL often bound to 5433.
      - "5434:5432"
    environment:
      POSTGRES_USER: devradar
      POSTGRES_PASSWORD: devradar
      POSTGRES_DB: devradar
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devradar"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devradar-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devradar-net

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: devradar
      MINIO_ROOT_PASSWORD: devradar123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - devradar-net

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  devradar-net:
    driver: bridge
