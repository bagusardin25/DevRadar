# Local development infrastructure ONLY.
# - Binds Postgres/Redis/MinIO to 127.0.0.1 (not the LAN).
# - Uses weak well-known passwords — never use this file as production deploy.
# - API / Celery / frontend still run on the host (see README).
#
#   docker compose -f infra/compose.yaml up -d
#
name: devradar

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Host-only bind: avoids exposing Compose DB on the LAN.
      # 5434 avoids clash with a local Windows PostgreSQL often bound to 5433.
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: devradar
      POSTGRES_PASSWORD: devradar
      POSTGRES_DB: devradar
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devradar"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devradar-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    # Host publish goes through Docker NAT (not loopback *inside* the container),
    # so Redis protected-mode would deny every host client without a password.
    # Safety for local dev is the 127.0.0.1 publish bind above — do not expose
    # this service on a public interface. Production Redis must use AUTH + TLS.
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - devradar-net
    restart: unless-stopped

  # Optional S3-compatible storage. App default is OBJECT_STORAGE_BACKEND=local.
  # Enable: docker compose -f infra/compose.yaml --profile object-storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["object-storage"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: devradar
      MINIO_ROOT_PASSWORD: devradar123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    # Official image has no preconfigured `mc` alias; TCP check is enough for local dev.
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devradar-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  devradar-net:
    driver: bridge
